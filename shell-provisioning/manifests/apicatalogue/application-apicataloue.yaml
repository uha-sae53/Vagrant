apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api1
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: api1=ghcr.io/ton-org/api1
    argocd-image-updater.argoproj.io/api1.update-strategy: latest
    argocd-image-updater.argoproj.io/write-back-method: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/uha-sae53/api-catalogue.git     # <--- ton repo API1
    targetRevision: main
    path: .                                      # <--- tes manifests sont à la racine du repo
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
