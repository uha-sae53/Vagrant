## Ficher configMap pour Filebeat dans Kubernetes.
## Ce fichier définit la configuration de Filebeat pour collecter les logs des conteneurs Docker
## et les envoyer à Elasticsearch. Il inclut également des processeurs pour enrichir et
## filtrer les logs avant leur envoi.

apiVersion: v1
kind: ConfigMap
metadata:
  namespace: monitoring
  annotations:
    use-subpath: "true"
  labels:
    io.kompose.service: filebeat
  name: filebeat-cm0
data:
  filebeat.yml: |-
    filebeat.inputs:
      # Collecte des logs des conteneurs Kubernetes
      - type: container
        enabled: true
        paths:
          - /var/log/containers/*.log

        # Parse JSON si présent
        json.keys_under_root: true
        json.add_error_key: true
        json.message_key: log

        processors:
          # Ajouter les métadonnées Kubernetes (pod, namespace, labels)
          - add_kubernetes_metadata:
              in_cluster: true
              host: "https://kubernetes.default.svc:443"
              matchers:
                - logs_path:
                    patterns:
                      - '/var/log/containers/'
          # Ajouter des champs personnalisés
          - add_fields:
              target: ''
              fields:
                environment: production
                project: sae-ecommerce
          # Nettoyer les champs inutiles
          - drop_fields:
              fields:
                - "agent.ephemeral_id"
                - "agent.id"
                - "ecs.version"
                - "host.name"
                - "input.type"
              ignore_missing: true

    # Sortie vers Elasticsearch
    output.elasticsearch:
      hosts: ["http://elasticsearch:9200"]
      index: "docker-logs-%{+yyyy.MM.dd}"

    setup.template.name: "docker-logs"
    setup.template.pattern: "docker-logs-*"
    setup.ilm.enabled: false

    # Configuration pour Kibana
    setup.kibana:
      host: "http://kibana:5601"

    logging.level: info
    logging.to_files: false
    logging.to_stderr: true

    monitoring.enabled: false
