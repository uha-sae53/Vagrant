apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f ./docker/docker-compose.yml -o ./manifests/
    kompose.version: 1.37.0 (fb0539e64)
    service: dbcatalogue
    type: database
  labels:
    io.kompose.service: dbcatalogue
  name: dbcatalogue
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: dbcatalogue
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f ./docker/docker-compose.yml -o ./manifests/
        kompose.version: 1.37.0 (fb0539e64)
        service: dbcatalogue
        type: database
      labels:
        io.kompose.service: dbcatalogue
    spec:
      containers:
        - env:
            - name: MARIADB_DATABASE
              value: catalogue
            - name: MARIADB_ROOT_PASSWORD
              value: catalogue
          image: mariadb:latest
          imagePullPolicy: IfNotPresent
          livenessProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            failureThreshold: 5
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          name: dbcatalogue
          ports:
            - containerPort: 3306
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: dbcatalogue
      restartPolicy: Always
      volumes:
        - name: dbcatalogue
          persistentVolumeClaim:
            claimName: dbcatalogue
