apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbpanier
  labels:
    io.kompose.service: dbpanier
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: dbpanier
  template:
    metadata:
      labels:
        io.kompose.service: dbpanier
    spec:
      containers:
        - name: dbpanier
          image: redis:7.2
          ports:
            - containerPort: 6379
              protocol: TCP
          volumeMounts:
            - name: dbpanier-data
              mountPath: /data
      volumes:
        - name: dbpanier-data
          persistentVolumeClaim:
            claimName: dbpanier-persistentvolumeclaim
