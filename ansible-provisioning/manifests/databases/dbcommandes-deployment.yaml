apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose-commandes.yml -o ../manifests/
    kompose.version: 1.37.0 (fb0539e64)
    service: db_commandes
    type: database
  labels:
    io.kompose.service: dbcommandes
  name: dbcommandes
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: dbcommandes
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose-commandes.yml -o ../manifests/
        kompose.version: 1.37.0 (fb0539e64)
        service: db_commandes
        type: database
      labels:
        io.kompose.service: dbcommandes
    spec:
      containers:
        - env:
            - name: MARIADB_DATABASE
              value: commandes
            - name: MARIADB_ROOT_PASSWORD
              value: commandes
          image: mariadb:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            failureThreshold: 5
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          name: dbcommandes
          ports:
            - containerPort: 3306
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: dbcommandes
      restartPolicy: Always
      volumes:
        - name: dbcommandes
          persistentVolumeClaim:
            claimName: dbcommandes
