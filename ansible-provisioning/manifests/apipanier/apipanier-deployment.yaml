apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f ./docker/docker-compose.yml -o ./manifests/
    kompose.version: 1.37.0 (fb0539e64)
    service: api_panier
    type: api
  labels:
    io.kompose.service: api-panier
  name: api-panier
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: api-panier
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f ./docker/docker-compose.yml -o ./manifests/
        kompose.version: 1.37.0 (fb0539e64)
        service: api_panier
        type: api
      labels:
        io.kompose.service: api-panier
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - image: ghcr.io/uha-sae53/api-panier:latest
          name: api-panier
          ports:
            - containerPort: 8002
              protocol: TCP
          env:
            - name: DB_PANIER_HOST
              value: "dbpanier"
            - name: DB_PANIER_PORT
              value: "3306"
            - name: DB_PANIER_NAME
              value: "panier"
            - name: DB_PANIER_USER
              value: "panier"
            - name: DB_PANIER_PASSWORD
              value: "panier"
              
          initContainers:
            - name: wait-for-db
              image: busybox:latest
              command: ['sh', '-c', 'until nc -z dbpanier 3306; do echo waiting for db; sleep 2; done;']
      restartPolicy: Always
