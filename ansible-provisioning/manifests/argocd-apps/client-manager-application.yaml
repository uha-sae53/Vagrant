apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: client-manager-application
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: ghcr.io/uha-sae53/api-clients/client-manager
    argocd-image-updater.argoproj.io/client-manager.update-strategy: latest
    argocd-image-updater.argoproj.io/write-back-method: argocd
spec:
  destination:
    namespace: apps
    server: https://kubernetes.default.svc
  source:
    path: ansible-provisioning/manifests/apiclients
    repoURL: https://github.com/uha-sae53/Vagrant.git
    targetRevision: main
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
