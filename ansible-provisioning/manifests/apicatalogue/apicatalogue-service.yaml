apiVersion: v1
kind: Service
metadata:
  annotations:
    kompose.cmd: kompose convert -f ./docker/docker-compose.yml -o ./manifests/
    kompose.version: 1.37.0 (fb0539e64)
    logformat: gunicorn
    service: apicatalogue
    type: api
  labels:
    io.kompose.service: apicatalogue
  name: apicatalogue
spec:
  type: NodePort
  ports:
    - name: "8001"
      port: 8001
      targetPort: 8001  # ✅ CORRECTION: Doit correspondre au port du conteneur
      nodePort: 30801
  selector:
    io.kompose.service: apicatalogue