apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose-commandes.yml -o ../manifests/
    kompose.version: 1.37.0 (fb0539e64)
    service: api_commandes
    type: api
  labels:
    io.kompose.service: apicommandes
  name: apicommandes
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: apicommandes
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose-commandes.yml -o ../manifests/
        kompose.version: 1.37.0 (fb0539e64)
        service: api_commandes
        type: api
      labels:
        io.kompose.service: apicommandes
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36.1
          imagePullPolicy: Always
          command: ['sh', '-c', 'until nc -z dbcommandes 3309; do echo waiting for db; sleep 2; done;']
      containers:
        - image: ghcr.io/uha-sae53/api-commandes:latest
          imagePullPolicy: Always
          name: apicommandes
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          ports:
            - containerPort: 8003
              protocol: TCP
          env:
            - name: DB_COMMANDES_HOST
              value: "dbcommandes"
            - name: DB_COMMANDES_PORT
              value: "3309"
            - name: DB_COMMANDES_NAME
              value: "commandes"
            - name: DB_COMMANDES_USER
              value: "root"
            - name: DB_COMMANDES_PASSWORD
              value: "commandes"
      restartPolicy: Always