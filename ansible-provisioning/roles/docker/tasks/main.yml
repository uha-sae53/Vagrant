---
# attendre apt et killer les process bloquants
- name: Attendre apt
  shell: |
    for i in {1..120}; do
      if ! fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 && \
         ! fuser /var/lib/dpkg/lock >/dev/null 2>&1 && \
         ! fuser /var/lib/apt/lists/lock >/dev/null 2>&1; then
        exit 0
      fi
      if [ $i -gt 60 ]; then
        killall apt apt-get dpkg 2>/dev/null || true
      fi
      sleep 2
    done
    killall -9 apt apt-get dpkg 2>/dev/null || true
    sleep 2
  changed_when: false

- name: Installer les deps docker
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: yes
  register: dependance_docker
  until: dependance_docker is success
  retries: 5
  delay: 10

- name: Creer dossier keyrings
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: DL cle GPG docker
  get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

# encore attendre apt...
- name: Attendre apt
  shell: |
    for i in {1..60}; do
      if ! fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 && ! fuser /var/lib/apt/lists/lock >/dev/null 2>&1; then
        exit 0
      fi
      sleep 2
    done
    killall apt apt-get 2>/dev/null || true
    sleep 2
  changed_when: false

- name: Ajouter repo docker
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian bullseye stable"
    state: present
    filename: docker

- name: Attendre apt
  shell: |
    for i in {1..60}; do
      if ! fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; then
        exit 0
      fi
      sleep 2
    done
    killall apt apt-get 2>/dev/null || true
    sleep 2
  changed_when: false

- name: Installer docker
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present
    update_cache: yes
  register: dcker_installation
  until: dcker_installation is success
  retries: 5
  delay: 10


################# CONFIGURATION CONTAINERD #################
#### Source : https://kubernetes.io/docs/setup/production-environment/container-runtimes/#containerd ####
- name: Creer dossier config containerd
  file:
    path: /etc/containerd
    state: directory
    mode: '0755'

- name: Virer ancienne config containerd
  file:
    path: /etc/containerd/config.toml
    state: absent

- name: Générer le fichier de configuration containerd
  command: containerd config default > /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml
  become: true

- name: Attendre creation fichier config
  wait_for:
    path: /etc/containerd/config.toml
    state: present
    timeout: 30

- name: Mettre SystemdCgroup
  replace:
    path: /etc/containerd/config.toml
    regexp: '(\s+)SystemdCgroup\s*=\s*false'
    replace: '\1SystemdCgroup = true'

- name: Verifier config SystemdCgroup appliquee
  shell: grep -q "SystemdCgroup = true" /etc/containerd/config.toml
  register: systemd_cgroup_check
  failed_when: systemd_cgroup_check.rc != 0
  changed_when: false

- name: Configurer sandbox_image pour Kubernetes
  replace:
    path: /etc/containerd/config.toml
    regexp: '(\s+)sandbox_image\s*=\s*".*"'
    replace: '\1sandbox_image = "registry.k8s.io/pause:3.9"'
  ignore_errors: yes

- name: Restart containerd
  systemd:
    name: containerd
    state: restarted
    enabled: yes
    daemon_reload: yes

- name: Attendre containerd
  pause:
    seconds: 10

- name: Check socket containerd
  stat:
    path: /var/run/containerd/containerd.sock
  register: containerd_socket
  until: containerd_socket.stat.exists
  retries: 10
  delay: 3

- name: Verif containerd fonctionne
  shell: ctr --connect-timeout 5s version >/dev/null 2>&1
  register: containerd_check
  changed_when: false
  retries: 10
  delay: 3
  until: containerd_check.rc == 0
