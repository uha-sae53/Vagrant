---
# ansible-provisioning/roles/k8s-dashboard/tasks/main.yml
# CORRECTION: Meilleure gestion de l'idempotence pour le Dashboard

- name: Attendre avant installation Helm
  shell: |
    for i in {1..60}; do
      if ! fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; then
        exit 0
      fi
      sleep 2
    done
    killall apt apt-get 2>/dev/null || true
    sleep 2
  changed_when: false

- name: Installer les dependances pour Helm
  apt:
    name:
      - curl
      - gpg
      - apt-transport-https
    state: present
  register: helm_deps
  until: helm_deps is success
  retries: 5
  delay: 10

- name: Telecharger la cle GPG de Helm
  shell: curl -fsSL https://packages.buildkite.com/helm-linux/helm-debian/gpgkey | gpg --dearmor | tee /usr/share/keyrings/helm.gpg > /dev/null
  args:
    creates: /usr/share/keyrings/helm.gpg

- name: Attendre avant ajout repository Helm
  shell: |
    for i in {1..60}; do
      if ! fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 && ! fuser /var/lib/apt/lists/lock >/dev/null 2>&1; then
        exit 0
      fi
      sleep 2
    done
    killall apt apt-get 2>/dev/null || true
    sleep 2
  changed_when: false

- name: Ajouter le repository Helm
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/helm.gpg] https://packages.buildkite.com/helm-linux/helm-debian/any/ any main"
    state: present
    filename: helm-stable-debian

- name: Attendre avant installation Helm
  shell: |
    for i in {1..60}; do
      if ! fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; then
        exit 0
      fi
      sleep 2
    done
    killall apt apt-get 2>/dev/null || true
    sleep 2
  changed_when: false

- name: Installer Helm
  apt:
    name: helm
    state: present
    update_cache: yes
  register: helm_installation
  until: helm_installation is success
  retries: 5
  delay: 10

- name: Ajouter le repository Kubernetes Dashboard
  become_user: vagrant
  command: helm repo add kubernetes-dashboard https://kubernetes.github.io/dashboard/
  environment:
    KUBECONFIG: /home/vagrant/.kube/config
  register: ajout_repo_helm
  changed_when: "'already exists' not in ajout_repo_helm.stderr"
  failed_when: false

- name: Mettre à jour les repositories Helm
  become_user: vagrant
  command: helm repo update
  environment:
    KUBECONFIG: /home/vagrant/.kube/config

# ===== CORRECTION ICI =====
- name: Verifier si le Dashboard est deja installe
  shell: helm list -n kubernetes-dashboard --deployed | grep -w kubernetes-dashboard
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: dashboard_existe
  failed_when: false
  changed_when: false

- name: Supprimer l'ancienne release si elle existe mais est cassee
  shell: helm uninstall kubernetes-dashboard -n kubernetes-dashboard
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: 
    - dashboard_existe.rc == 0
    - dashboard_existe.stdout is search('failed|pending')
  failed_when: false

- name: Deployer le Dashboard Kubernetes avec Helm
  become_user: vagrant
  command: >
    helm upgrade --install kubernetes-dashboard kubernetes-dashboard/kubernetes-dashboard
    --create-namespace
    --namespace kubernetes-dashboard
    --set kong.proxy.http.enabled=true
    --set kong.proxy.http.servicePort=80
    --set kong.proxy.tls.enabled=true
    --set kong.proxy.tls.servicePort=443
    --set kong.resources.requests.cpu=100m
    --set kong.resources.requests.memory=128Mi
    --set kong.resources.limits.cpu=500m
    --set kong.resources.limits.memory=512Mi
    --set app.resources.requests.cpu=100m
    --set app.resources.requests.memory=128Mi
    --set app.resources.limits.cpu=500m
    --set app.resources.limits.memory=512Mi
    --timeout=10m
  environment:
    KUBECONFIG: /home/vagrant/.kube/config
  register: dashboard_deploy
  failed_when: 
    - dashboard_deploy.rc != 0
    - "'another operation' not in dashboard_deploy.stderr"
  changed_when: "'upgraded' in dashboard_deploy.stdout or 'installed' in dashboard_deploy.stdout"

- name: Attendre 30 secondes avant de verifier le deploiement
  pause:
    seconds: 30
  when: dashboard_deploy.changed

- name: Verifier l'etat des pods du Dashboard
  command: kubectl get pods -n kubernetes-dashboard
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: dashboard_pods
  changed_when: false

- name: Afficher l'etat des pods
  debug:
    var: dashboard_pods.stdout_lines

- name: Attendre que le deploiement soit disponible (avec retry)
  command: kubectl wait --for=condition=available --timeout=120s deployment/kubernetes-dashboard-kong -n kubernetes-dashboard
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: dash_att
  retries: 5
  delay: 30
  until: dash_att.rc == 0
  ignore_errors: yes

- name: Configurer le service en NodePort
  command: >
    kubectl -n kubernetes-dashboard patch svc kubernetes-dashboard-kong-proxy -p '{"spec": {"type": "NodePort", "ports": [{"name": "kong-proxy-tls", "port": 443, "targetPort": 8443, "nodePort": 30443}]}}'
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: patch_dashboard_pod
  failed_when: false
  changed_when: "'patched' in patch_dashboard_pod.stdout or 'configured' in patch_dashboard_pod.stdout"

- name: Creer le ServiceAccount admin-user
  command: kubectl create serviceaccount admin-user -n kubernetes-dashboard
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: sa_create
  failed_when: sa_create.rc != 0 and 'AlreadyExists' not in sa_create.stderr
  changed_when: "'created' in sa_create.stdout"

- name: Creer le ClusterRoleBinding
  command: kubectl create clusterrolebinding admin-user-binding --clusterrole=cluster-admin --serviceaccount=kubernetes-dashboard:admin-user
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: crb_create
  failed_when: crb_create.rc != 0 and 'AlreadyExists' not in crb_create.stderr
  changed_when: "'created' in crb_create.stdout"

- name: Recuperer le token d'acces
  command: kubectl -n kubernetes-dashboard create token admin-user
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: dashboard_token
  changed_when: false

- name: Afficher les informations du Dashboard
  debug:
    msg:
      - "=========================================="
      - "Dashboard Kubernetes configure avec succes"
      - "=========================================="
      - ""
      - "URL d'acces : https://192.168.56.10:30443"
      - ""
      - "Token : {{ dashboard_token.stdout }}"
      - ""