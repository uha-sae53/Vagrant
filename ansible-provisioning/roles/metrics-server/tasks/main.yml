---
# Installation du Metrics Server pour HPA
# Le Metrics Server sera installé APRÈS que les workers aient rejoint le cluster

- name: Nettoyer les anciennes ressources Metrics Server
  shell: |
    kubectl delete deployment metrics-server -n kube-system --ignore-not-found=true --grace-period=0 --force
    kubectl delete service metrics-server -n kube-system --ignore-not-found=true
    kubectl delete apiservice v1beta1.metrics.k8s.io --ignore-not-found=true
    kubectl delete clusterrolebinding metrics-server:system:auth-delegator --ignore-not-found=true
    kubectl delete clusterrolebinding system:metrics-server --ignore-not-found=true
    kubectl delete clusterrole system:aggregated-metrics-reader --ignore-not-found=true
    kubectl delete clusterrole system:metrics-server --ignore-not-found=true
    kubectl delete rolebinding metrics-server-auth-reader -n kube-system --ignore-not-found=true
    kubectl delete serviceaccount metrics-server -n kube-system --ignore-not-found=true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: cleanup_metrics
  changed_when: false
  failed_when: false

- name: Attendre la suppression complete
  pause:
    seconds: 10
  when: cleanup_metrics.changed

- name: Installer le Metrics Server
  shell: kubectl apply -f /vagrant/manifests/metrics-server/metrics-server.yaml 2>&1 || true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: metrics_install
  changed_when: false
  failed_when: false

- name: Afficher message sur le Metrics Server
  debug:
    msg:
      - "=========================================="
      - "Metrics Server - Installation lancee"
      - "=========================================="
      - ""
      - "Le Metrics Server sera automatiquement deploye"
      - "une fois que les workers auront rejoint le cluster."
      - ""
      - "Pour verifier l'etat du Metrics Server plus tard:"
      - "  vagrant ssh vm-master -c 'kubectl get pods -n kube-system -l k8s-app=metrics-server'"
      - "  vagrant ssh vm-master -c 'kubectl top nodes'"
      - ""
      - "Note: Les metriques seront disponibles 2-3 minutes"
      - "apres que tous les workers soient Ready."
      - ""