---
# init du cluster
- name: Check si cluster deja init
  stat:
    path: /etc/kubernetes/admin.conf
  register: k8s_initialise

- name: Reset kubeadm si echec precedent
  command: kubeadm reset -f
  when: not k8s_initialise.stat.exists
  ignore_errors: yes

- name: Nettoyer config kubelet
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/kubernetes/manifests
    - /var/lib/kubelet
    - /etc/cni/net.d
  when: not k8s_initialise.stat.exists
  ignore_errors: yes

- name: Recreer dossiers
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/kubernetes/manifests
    - /var/lib/kubelet
  when: not k8s_initialise.stat.exists

- name: Restart containerd avant init
  systemd:
    name: containerd
    state: restarted
  when: not k8s_initialise.stat.exists

- name: Restart kubelet avant init
  systemd:
    name: kubelet
    state: restarted
  when: not k8s_initialise.stat.exists
  ignore_errors: yes

- name: Attendre services
  pause:
    seconds: 5
  when: not k8s_initialise.stat.exists

- name: Init cluster k8s
  command: kubeadm init --apiserver-advertise-address=192.168.56.10 --pod-network-cidr=10.244.0.0/16 --v=5
  when: not k8s_initialise.stat.exists
  register: kubeadm_init
  failed_when: false

- name: Afficher logs kubeadm si erreur
  debug:
    msg: "{{ kubeadm_init.stdout_lines }}"
  when: not k8s_initialise.stat.exists and kubeadm_init.rc != 0

- name: Fail si kubeadm init a echoue
  fail:
    msg: "kubeadm init a echoue. Verifiez les logs ci-dessus."
  when: not k8s_initialise.stat.exists and kubeadm_init.rc != 0

- name: Creer dossier .kube vagrant
  file:
    path: /home/vagrant/.kube
    state: directory
    owner: vagrant
    group: vagrant
    mode: '0755'

- name: Copier config kubectl
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/vagrant/.kube/config
    remote_src: yes
    owner: vagrant
    group: vagrant
    mode: '0644'

# reseau flannel pour la com entre pods
- name: Installer Flannel
  become_user: vagrant
  command: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
  environment:
    KUBECONFIG: /home/vagrant/.kube/config


######## CONFIGURATION APRES INIT ########
### Source : https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/create-cluster-kubeadm/ ###

# recuperer token pour les workers
- name: Recuperer token
  shell: kubeadm token list | grep authentication | head -n1 | awk '{print $1}'
  register: k8s_token
  changed_when: false

- name: Recuperer hash CA
  shell: openssl x509 -pubkey -in /etc/kubernetes/pki/ca.crt | openssl rsa -pubin -outform der 2>/dev/null | openssl dgst -sha256 -hex | sed 's/^.* //'
  register: k8s_ca_hash
  changed_when: false

# creer le script de join pour les workers
- name: Generer commande join
  copy:
    content: "kubeadm join 192.168.56.10:6443 --token {{ k8s_token.stdout }} --discovery-token-ca-cert-hash sha256:{{ k8s_ca_hash.stdout }}"
    dest: /vagrant/join.sh
    mode: '0755'

- name: Attendre synchro fichier
  pause:
    seconds: 3

- name: Creer fichier .master-ready
  copy:
    content: "Master initialized at {{ ansible_date_time.iso8601 }}"
    dest: /vagrant/.master-ready

# storage local
# Il permet aux pods de demander du stockage persistant à partir d'un PersistentVolumeClaim (PVC)
- name: Installer local-path provisioner
  command: kubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/master/deploy/local-path-storage.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  ignore_errors: yes

- name: Definir local-path par defaut
  command: kubectl annotate storageclass local-path storageclass.kubernetes.io/is-default-class=true --overwrite
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  ignore_errors: yes


# Installation du calculateur de metriques pour le scheduler
- name: Installer Metrics Server
  command: kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  ignore_errors: yes

# secret pour pull les images depuis github
# Permet de pull les images privees depuis ghcr.io
- name: Creer secret ghcr
  shell: |
    set -e
    # Create or update ghcr secret in namespace 'apps'
    kubectl --kubeconfig=/etc/kubernetes/admin.conf create secret docker-registry ghcr-secret \
      --docker-server=ghcr.io \
      --docker-username={{ ghcr_username | default('uha-sae53') }} \
      --docker-password='{{ ghcr_token | default("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") }}' \
      --namespace=apps --dry-run=client -o yaml | kubectl --kubeconfig=/etc/kubernetes/admin.conf apply -f -
    # Also ensure the secret exists in 'default' namespace (some manifests use default)
    kubectl --kubeconfig=/etc/kubernetes/admin.conf create secret docker-registry ghcr-secret \
      --docker-server=ghcr.io \
      --docker-username={{ ghcr_username | default('uha-sae53') }} \
      --docker-password='{{ ghcr_token | default("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") }}' \
      --namespace=default --dry-run=client -o yaml | kubectl --kubeconfig=/etc/kubernetes/admin.conf apply -f -
    # Also ensure the secret exists in 'argocd' namespace (used by argocd-image-updater / argocd)
    kubectl --kubeconfig=/etc/kubernetes/admin.conf create secret docker-registry ghcr-secret \
      --docker-server=ghcr.io \
      --docker-username={{ ghcr_username | default('uha-sae53') }} \
      --docker-password='{{ ghcr_token | default("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") }}' \
      --namespace=argocd --dry-run=client -o yaml | kubectl --kubeconfig=/etc/kubernetes/admin.conf apply -f -
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  ignore_errors: yes
  no_log: true

# configuration du ServiceAccount par defaut pour utiliser le secret ghcr
# ServiceAccount permet aux pods de pull les images depuis ghcr.io sans avoir a definir le secret dans chaque manifest
- name: Attendre ServiceAccount default
  command: kubectl get serviceaccount default -n default
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: sa_check
  until: sa_check.rc == 0
  retries: 30
  delay: 2
  changed_when: false

- name: Attacher secret au SA
  shell: |
    # Patch default ServiceAccount in default and apps namespaces to reference the ghcr secret
    kubectl --kubeconfig=/etc/kubernetes/admin.conf patch serviceaccount default -n default -p '{"imagePullSecrets":[{"name":"ghcr-secret"}]}' || true
    kubectl --kubeconfig=/etc/kubernetes/admin.conf patch serviceaccount default -n apps -p '{"imagePullSecrets":[{"name":"ghcr-secret"}]}' || true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

# NOTE: Les manifests applicatifs ne sont PAS deployes ici
# Ils sont geres par ArgoCD via les Applications dans /vagrant/manifests/argocd-apps/
# Cela evite les conflits de ports et permet le GitOps avec auto-sync

# Creer le namespace apps pour les applications et databases
- name: Creer namespace apps
  command: kubectl create namespace apps
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: namespace_apps
  failed_when: false
  changed_when: "'created' in namespace_apps.stdout"

# Deployer les bases de donnees dans le namespace apps
- name: Appliquer les manifests databases dans apps
  command: kubectl apply -f /vagrant/manifests/databases/ -n apps
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: db_apply_result
  changed_when: "'created' in db_apply_result.stdout or 'configured' in db_apply_result.stdout"
