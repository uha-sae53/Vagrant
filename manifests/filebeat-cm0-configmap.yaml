apiVersion: v1
data:
  config.yaml: "filebeat.inputs:\n  # Collecte des logs de tous les conteneurs Docker\n  - type: container\n    enabled: true\n    paths:\n      - /var/lib/docker/containers/*/*.log\n    \n    # Configuration pour parser les logs JSON\n    json.keys_under_root: true\n    json.add_error_key: true\n    json.message_key: log\n    \n    processors:\n      # Ajouter les métadonnées Docker (nom du conteneur, labels, etc.)\n      - add_docker_metadata:\n          host: \"unix:///var/run/docker.sock\"\n          match_fields: [\"container.id\"]\n          labels.dedot: true\n      \n      # Parser le message pour extraire le timestamp et le niveau de log\n      - dissect:\n          tokenizer: \"[%{timestamp}] [%{process_id}] [%{log_level}] %{message}\"\n          field: \"message\"\n          target_prefix: \"gunicorn\"\n          ignore_failure: true\n      \n      # Ajouter des champs personnalisés\n      - add_fields:\n          target: ''\n          fields:\n            environment: production\n            project: sae-ecommerce\n      \n      # Renommer les champs pour une meilleure lisibilité\n      - rename:\n          fields:\n            - from: \"container.name\"\n              to: \"service_name\"\n          ignore_missing: true\n      \n      # Nettoyer les champs inutiles pour réduire la taille\n      - drop_fields:\n          fields: \n            - \"agent.ephemeral_id\"\n            - \"agent.id\" \n            - \"ecs.version\"\n            - \"host.name\"\n            - \"input.type\"\n          ignore_missing: true\n\n# Configuration de sortie vers Elasticsearch\noutput.elasticsearch:\n  hosts: [\"elasticsearch:9200\"]\n  # Index avec nom plus explicite et rotation quotidienne\n  index: \"docker-logs-%{+yyyy.MM.dd}\"\n  \n# Configuration de l'index template\nsetup.template.name: \"docker-logs\"\nsetup.template.pattern: \"docker-logs-*\"\nsetup.ilm.enabled: false\n\n# Permettre à Filebeat de créer les index templates et dashboards dans Kibana\nsetup.kibana:\n  host: \"kibana:5601\"\n\n# Niveau de logs de Filebeat lui-même\nlogging.level: info\nlogging.to_files: false\nlogging.to_stderr: true\n\n# Métriques internes de Filebeat (optionnel)\nmonitoring.enabled: false"
kind: ConfigMap
metadata:
  annotations:
    use-subpath: "true"
  labels:
    io.kompose.service: filebeat
  name: filebeat-cm0
