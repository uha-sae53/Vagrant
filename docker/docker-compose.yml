services:
  db_clients:
    image: mariadb:latest
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: clients
    volumes:
      - db_clients:/var/lib/mysql
    networks:
      - prod
    labels:
      - "service=db_clients"
      - "type=database"

  api_clients:
    image: ghcr.io/uha-sae53/api-clients/client-manager:latest
    restart: always
    ports:
      - 8000:8000 
    depends_on:
      - db_clients
    networks:
      - prod
    labels:
      - "service=api_clients"
      - "type=api"
      - "log_format=gunicorn"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  db_catalogue:
    image: mariadb:latest
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: catalogue
    volumes:
      - db_catalogue:/var/lib/mysql
    networks:
      - prod
    labels:
      - "service=db_catalogue"
      - "type=database"

  api_catalogue:
    image: ghcr.io/uha-sae53/api-clients/catalogue-manager:latest
    restart: always
    ports:
      - 8001:8000
    depends_on:
      - db_catalogue
    networks:
      - prod
    labels:
      - "service=api_catalogue"
      - "type=api"
      - "log_format=gunicorn"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: nginx:latest
    restart: always
    ports:
      - 8004:8000
    depends_on:
      - api_clients
      - api_catalogue
      - api_commandes

    
  # ELK Stack
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - prod

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    restart: always
    ports:
      - 5601:5601
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - prod

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    restart: always
    user: root
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./filebeat/config.yaml:/usr/share/filebeat/filebeat.yml:ro
    command: ["filebeat", "-e", "-strict.perms=false"]
    depends_on:
      - elasticsearch
    networks:
      - prod

volumes:
  db_clients:
  db_catalogue:
  #db_commandes:
  #db_panier:
  elasticsearch_data:

networks:
  prod:
    driver: bridge


