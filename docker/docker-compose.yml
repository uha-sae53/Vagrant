services:
  dbclients:
    image: mariadb:latest
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: clients
      MARIADB_DATABASE: clients
    ports:
      - 3306:3306
    volumes:
      - dbclients:/var/lib/mysql
    networks:
      - prod
    labels:
      - "service=dbclients"
      - "type=database"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  apiclients:
    image: ghcr.io/uha-sae53/api-clients/client-manager:latest
    restart: always
    ports:
      - 8000:8000 
    depends_on:
      dbclients:
        condition: service_healthy
    networks:
      - prod
    labels:
      - "service=apiclients"
      - "type=api"
      - "log_format=gunicorn"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  dbcatalogue:
    image: mariadb:latest
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: catalogue
      MARIADB_DATABASE: catalogue
    ports:
      - 3307:3306
    volumes:
      - dbcatalogue:/var/lib/mysql
    networks:
      - prod
    labels:
      - "service=dbcatalogue"
      - "type=database"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  apicatalogue:
    image: ghcr.io/uha-sae53/api-catalogue:latest
    restart: always
    ports:
      - 8001:8000
    depends_on:
      dbcatalogue:
        condition: service_healthy
    networks:
      - prod
    labels:
      - "service=apicatalogue"
      - "type=api"
      - "logformat=gunicorn"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api_commandes:
    image: ghcr.io/uha-sae53/api-commandes:latest
    restart: always
    ports:
      - 8002:8000
    depends_on:
      - db_commandes
    networks:
      - prod
    labels:
      - "service=api_commandes"
      - "type=api"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db_commandes:
    image: mariadb:latest
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: commandes
      MARIADB_DATABASE: commandes
    ports:
      - 3308:3306
    volumes:
      - db_commandes:/var/lib/mysql
    networks:
      - prod
    labels:
      - "service=db_commandes"
      - "type=database"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: nginx:latest
    restart: always
    ports:
      - 8004:80
    depends_on:
      - apiclients
      - apicatalogue
    networks:
      - prod

  # ELK Stack
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    restart: always
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - 9200:9200
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - prod

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    restart: always
    ports:
      - 5601:5601
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - prod

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    restart: always
    user: root
    ports:
      - 5044:5044
    volumes:
      - ./filebeat/config.yaml:/usr/share/filebeat/filebeat.yml:ro
    command: ["filebeat", "-e", "-strict.perms=false"]
    depends_on:
      - elasticsearch
    networks:
      - prod

volumes:
  dbclients:
  dbcatalogue:
  db_commandes:
  elasticsearch_data:

networks:
  prod:
    driver: bridge

