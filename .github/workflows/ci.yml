name: K8S YAML Manifest Lint

on:
  push:
    branches:
      - main
      - 'release/*'
  pull_request:
    branches:
      - main

jobs:
  yamllint:
    name: Lint Kubernetes YAML Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Vérification du code
        uses: actions/checkout@v3

      - name: Installer KubeLinter
        run: |
          curl -sSL https://github.com/stackrox/kubelinter/releases/latest/download/kubelinter-linux-amd64.tar.gz -o kubelinter.tar.gz
          tar -xzf kubelinter.tar.gz
          sudo mv kubelinter /usr/local/bin/
          kubelinter version

      - name: Lancer KubeLinter
        run: |
          kubelinter lint Vagrant/ansible-provisioning/manifests/ Vagrant/shell-provisioning/manifests/ | tee kube-linter-report.txt

      - name: Afficher les résultats
        run: cat kube-linter-report.txt
